<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chart Analyzer Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#6366f1', 600: '#4f46e5' },
            dark: { 800: '#1e1e2d', 900: '#13131a', 700: '#2a2a3c' }
          }
        }
      }
    }
  </script>
  <style>
    .drag-active { border-color: #6366f1 !important; background-color: rgba(99, 102, 241, 0.1) !important; }
  </style>
</head>
<body class="bg-dark-900 text-gray-100 min-h-screen p-4 md:p-8 font-sans">
  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-gray-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold text-white tracking-wide">AI Multi-Timeframe Chart Analyzer</h1>
        <p class="text-xs text-gray-400 mt-1">SMC / Price Action Signal Generator via OpenAI Vision</p>
      </div>
      <div class="flex items-center gap-2">
        <input type="password" id="apiKey" placeholder="OpenAI API Key (sk-...)" class="bg-dark-800 border border-gray-700 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-brand-500 w-64" />
      </div>
    </header>

    <!-- Upload Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- HTF Dropzone -->
      <div class="bg-dark-800 border border-gray-800 rounded-xl p-4 flex flex-col justify-between">
        <div class="flex justify-between items-center mb-3">
          <span class="text-sm font-semibold text-brand-500">Higher Timeframe (HTF Structure)</span>
          <span class="text-xs text-gray-500" id="htfLabel">M15 / M30 / H1 / H4</span>
        </div>
        
        <div id="dropHTF" class="border-2 border-dashed border-gray-700 hover:border-gray-500 rounded-lg p-6 text-center cursor-pointer transition-all relative min-h-[180px] flex flex-col justify-center items-center">
          <input type="file" id="fileHTF" accept="image/*" class="hidden" onchange="handleFileSelect(event, 'HTF')" />
          <div id="previewHTF" class="hidden w-full h-full relative">
            <img id="imgHTF" class="max-h-48 mx-auto rounded object-contain" />
            <button onclick="removeImage('HTF', event)" class="absolute top-0 right-0 bg-red-600 text-white rounded-full p-1 text-xs hover:bg-red-700">✕</button>
          </div>
          <div id="promptHTF" class="space-y-2 pointer-events-none">
            <svg class="w-8 h-8 mx-auto text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 002-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            <p class="text-xs text-gray-400">Klik atau Drag & Drop Chart HTF di sini</p>
          </div>
        </div>
      </div>

      <!-- LTF Dropzone -->
      <div class="bg-dark-800 border border-gray-800 rounded-xl p-4 flex flex-col justify-between">
        <div class="flex justify-between items-center mb-3">
          <span class="text-sm font-semibold text-emerald-500">Lower Timeframe (LTF Entry)</span>
          <span class="text-xs text-gray-500" id="ltfLabel">M1 / M3 / M5 / M15</span>
        </div>
        
        <div id="dropLTF" class="border-2 border-dashed border-gray-700 hover:border-gray-500 rounded-lg p-6 text-center cursor-pointer transition-all relative min-h-[180px] flex flex-col justify-center items-center">
          <input type="file" id="fileLTF" accept="image/*" class="hidden" onchange="handleFileSelect(event, 'LTF')" />
          <div id="previewLTF" class="hidden w-full h-full relative">
            <img id="imgLTF" class="max-h-48 mx-auto rounded object-contain" />
            <button onclick="removeImage('LTF', event)" class="absolute top-0 right-0 bg-red-600 text-white rounded-full p-1 text-xs hover:bg-red-700">✕</button>
          </div>
          <div id="promptLTF" class="space-y-2 pointer-events-none">
            <svg class="w-8 h-8 mx-auto text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            <p class="text-xs text-gray-400">Klik atau Drag & Drop Chart LTF di sini</p>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const images = { HTF: null, LTF: null };

    // Setup Event Listeners
    ['HTF', 'LTF'].forEach(type => {
      const dropZone = document.getElementById(`drop${type}`);
      const fileInput = document.getElementById(`file${type}`);

      // Click to trigger file input
      dropZone.addEventListener('click', () => fileInput.click());

      // Drag & Drop Handling
      ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
          e.preventDefault();
          e.stopPropagation();
          dropZone.classList.add('drag-active');
        }, false);
      });

      ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => {
          e.preventDefault();
          e.stopPropagation();
          dropZone.classList.remove('drag-active');
        }, false);
      });

      dropZone.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        const files = dt.files;
        if (files && files.length > 0) {
          processFile(files[0], type);
        }
      });
    });

    function handleFileSelect(event, type) {
      const files = event.target.files;
      if (files && files.length > 0) {
        processFile(files[0], type);
      }
    }

    function processFile(file, type) {
      if (!file.type.startsWith('image/')) {
        alert('Harap upload file gambar (.png, .jpg, .jpeg)');
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        images[type] = e.target.result;
        document.getElementById(`img${type}`).src = e.target.result;
        document.getElementById(`preview${type}`).classList.remove('hidden');
        document.getElementById(`prompt${type}`).classList.add('hidden');
      };
      reader.readAsDataURL(file);
    }

    function removeImage(type, event) {
      event.stopPropagation();
      images[type] = null;
      document.getElementById(`file${type}`).value = '';
      document.getElementById(`preview${type}`).classList.add('hidden');
      document.getElementById(`prompt${type}`).classList.remove('hidden');
    }
  </script>
</body>
</html>
