<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chart Analyzer - Configuration</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#6366f1', 600: '#4f46e5' },
            dark: { 900: '#0f172a', 800: '#1e293b', 700: '#334155' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-dark-900 text-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-dark-800 border border-slate-700/60 rounded-2xl p-6 shadow-2xl space-y-6">
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-brand-500/10 text-brand-500 font-bold text-2xl border border-brand-500/20">
        ⚡
      </div>
      <h1 class="text-xl font-bold text-white tracking-tight">AI Trading Terminal Setup</h1>
      <p class="text-xs text-slate-400">Pilih gaya trading dan masukkan API Key OpenAI Anda untuk memulai.</p>
    </div>

    <form id="setupForm" onsubmit="handleStart(event)" class="space-y-5">
      <!-- Input API Key -->
      <div class="space-y-1.5">
        <label class="text-xs font-medium text-slate-300">OpenAI API Key (Vision Supported)</label>
        <input 
          type="password" 
          id="apiKeyInput" 
          placeholder="sk-proj-..." 
          required 
          class="w-full bg-dark-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-brand-500 text-white transition placeholder-slate-500"
        />
        <p class="text-[10px] text-slate-400">API key disimpan lokal di browser Anda (tidak dikirim ke server luar).</p>
      </div>

      <!-- Pilihan Trading Style -->
      <div class="space-y-2">
        <label class="text-xs font-medium text-slate-300">Pilih Gaya Trading & Timeframe</label>
        <div class="grid grid-cols-2 gap-2.5">
          
          <label class="relative flex flex-col p-3 bg-dark-900 border border-slate-700 rounded-xl cursor-pointer hover:border-brand-500 transition has-[:checked]:border-brand-500 has-[:checked]:bg-brand-500/10">
            <input type="radio" name="tradingStyle" value="Scalping (M1 + M15)" checked class="sr-only" />
            <span class="text-xs font-bold text-white">Scalping</span>
            <span class="text-[10px] text-brand-500 mt-1 font-semibold">M1 (LTF) + M15 (HTF)</span>
          </label>

          <label class="relative flex flex-col p-3 bg-dark-900 border border-slate-700 rounded-xl cursor-pointer hover:border-brand-500 transition has-[:checked]:border-brand-500 has-[:checked]:bg-brand-500/10">
            <input type="radio" name="tradingStyle" value="Day Trade (M3 + M30)" class="sr-only" />
            <span class="text-xs font-bold text-white">Day Trade</span>
            <span class="text-[10px] text-brand-500 mt-1 font-semibold">M3 (LTF) + M30 (HTF)</span>
          </label>

          <label class="relative flex flex-col p-3 bg-dark-900 border border-slate-700 rounded-xl cursor-pointer hover:border-brand-500 transition has-[:checked]:border-brand-500 has-[:checked]:bg-brand-500/10">
            <input type="radio" name="tradingStyle" value="Intraday (M5 + H1)" class="sr-only" />
            <span class="text-xs font-bold text-white">Intraday</span>
            <span class="text-[10px] text-brand-500 mt-1 font-semibold">M5 (LTF) + H1 (HTF)</span>
          </label>

          <label class="relative flex flex-col p-3 bg-dark-900 border border-slate-700 rounded-xl cursor-pointer hover:border-brand-500 transition has-[:checked]:border-brand-500 has-[:checked]:bg-brand-500/10">
            <input type="radio" name="tradingStyle" value="Swing (M15 + H4)" class="sr-only" />
            <span class="text-xs font-bold text-white">Swing</span>
            <span class="text-[10px] text-brand-500 mt-1 font-semibold">M15 (LTF) + H4 (HTF)</span>
          </label>

        </div>
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        class="w-full bg-brand-500 hover:bg-brand-600 text-white font-semibold py-3 rounded-xl transition duration-200 text-sm shadow-lg shadow-brand-500/25 active:scale-[0.99]"
      >
        Buka Terminal Analisis ➔
      </button>
    </form>
  </div>

  <script>
    // Cek jika API key sudah tersimpan sebelumnya
    document.addEventListener('DOMContentLoaded', () => {
      const savedKey = localStorage.getItem('openai_api_key');
      if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
    });

    function handleStart(e) {
      e.preventDefault();
      const apiKey = document.getElementById('apiKeyInput').value.trim();
      const selectedStyle = document.querySelector('input[name="tradingStyle"]:checked').value;

      if (!apiKey) {
        alert('Harap masukkan OpenAI API Key terlebih dahulu!');
        return;
      }

      // Simpan konfigurasi ke LocalStorage
      localStorage.setItem('openai_api_key', apiKey);
      localStorage.setItem('trading_style', selectedStyle);

      // Pindah ke Halaman Dashboard
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
